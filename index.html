<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
    <script type="text/javascript" src="./js/script.js" defer></script>
    <title>Akiのクイズアプリ</title>
  </head>

  <body>
    <header>
      <h1>クイズで あそぼう</h1>
    </header>

    <main>
      <!--出題エリア-->
      <div class="question-area">
        <p class="description">すきな えを クリックしてね！</p>
        <div class="img-area" id="js-quizs-container"></div>

        <!--問題文表示-->
        <div class="question-display" id="js-question-display"></div>
      </div>

      <!--回答エリア-->
      <div class="answer-area">
        <div class="answer-choices-area">
          <div class="answer-choice" id="js-choice-display1"></div>
          <div class="answer-choice" id="js-choice-display2"></div>
          <div class="answer-choice" id="js-choice-display3"></div>
        </div>

        <!--正誤判定表示-->
        <div class="answer-display" id="js-answer-display"></div>
        <button class="clear-btn" id="js-clear-btn">もういちど やる</button>
      </div>
    </main>

    <footer>
      <a class="quiz-footer-text" id="js-footer-text-a" href="./admin.html"
        >管理者用画面</a
      >
    </footer>
  </body>
</html>
